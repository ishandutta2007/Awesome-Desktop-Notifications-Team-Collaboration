<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.18) translate(25px, -20px); opacity: 0.7; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
    @keyframes alertRing {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-1 {
      animation: pulseOrb 9s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .orb-2 {
      animation: pulseOrb 11s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .card-float-left {
      animation: floatCard1 7s ease-in-out infinite;
    }
    .card-float-right {
      animation: floatCard2 8s ease-in-out infinite;
    }
    .bell-ring {
      animation: alertRing 3s ease-in-out infinite;
      transform-origin: 600px 75px;
    }
    .stream-line {
      stroke-dasharray: 10 15;
      animation: streamData 12s linear infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Elements (Kept in Background behind content) -->
  <g opacity="0.6">
    <circle class="orb-1" cx="220" cy="120" r="160" fill="#4f46e5" filter="url(#softGlow)" />
    <circle class="orb-2" cx="980" cy="280" r="180" fill="#ec4899" filter="url(#softGlow)" />
    <circle cx="600" cy="380" r="130" fill="#06b6d4" opacity="0.25" filter="url(#softGlow)" />
  </g>

  <!-- Ambient Dynamic Connecting Vectors (Background) -->
  <path class="stream-line" d="M 50,340 C 300,380 400,260 600,290 C 800,320 950,220 1150,260" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.4" />
  <path class="stream-line" d="M 50,90 C 250,50 450,150 650,110 C 850,70 1000,180 1150,130" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Animated Floating Toast 1 (Left Background/Side Accent) -->
  <g class="card-float-left" transform="translate(60, 240)" filter="url(#cardShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="36" cy="37" r="16" fill="#10b981" fill-opacity="0.2" />
    <circle cx="36" cy="37" r="8" fill="#10b981" />
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">CI/CD Build Deployed</text>
    <text x="64" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">ntfy &bull; Production v2.4.0</text>
  </g>

  <!-- Animated Floating Toast 2 (Right Background/Side Accent) -->
  <g class="card-float-right" transform="translate(900, 80)" filter="url(#cardShadow)">
    <rect width="240" height="74" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="36" cy="37" r="16" fill="#6366f1" fill-opacity="0.2" />
    <circle cx="36" cy="37" r="8" fill="#818cf8" />
    <text x="64" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Team Alert Dispatched</text>
    <text x="64" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11">Apprise &bull; Discord + Gotify</text>
  </g>

  <!-- Central Foreground Content (Guaranteed Crisp Foreground Visibility) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(460, 48)">
      <rect width="280" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="20" cy="17" r="6" fill="#22c55e" />
      <text x="35" y="22" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Desktop Notifications
    </text>

    <!-- Subtitle Gradient Highlight -->
    <text x="600" y="200" text-anchor="middle" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.2">
      &amp; Team Collaboration Alerts
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="246" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Self-Hosted Push Daemons &bull; Real-Time Multi-Channel Routers &bull; Notification Infrastructure
    </text>

    <!-- Feature Tags / Pills Row -->
    <g transform="translate(185, 290)">
      <!-- Pill 1: Webhook Alerting -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1" />
        <text x="90" y="23" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Webhook Pipelines</text>
      </g>
      <!-- Pill 2: Self-Hosted Push -->
      <g transform="translate(195, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1" />
        <text x="90" y="23" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔔 Push &amp; Toast Daemons</text>
      </g>
      <!-- Pill 3: In-App Inbox Engines -->
      <g transform="translate(390, 0)">
        <rect width="195" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1" />
        <text x="97" y="23" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📬 In-App Notification Feeds</text>
      </g>
      <!-- Pill 4: Multi-Channel Orchestration -->
      <g transform="translate(600, 0)">
        <rect width="230" height="36" rx="18" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1" />
        <text x="115" y="23" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🔄 Cross-Channel Dispatchers</text>
      </g>
    </g>
  </g>
</svg>
