<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#311042;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 32px sans-serif; fill: #ffffff; }
      .subtitle { font: bold 18px sans-serif; fill: #818cf8; }
      .desc { font: 13px sans-serif; fill: #94a3b8; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .floating { animation: float 3s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  
  <!-- Decorative Grid Overlay -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.3">
    <path d="M0 40 L800 40 M0 80 L800 80 M0 120 L800 120 M0 160 L800 160" />
    <path d="M80 0 L80 200 M160 0 L160 200 M240 0 L240 200 M320 0 L320 200 M400 0 L400 200 M480 0 L480 200 M560 0 L560 200 M640 0 L640 200 M720 0 L720 200" />
  </g>

  <!-- Animated Content -->
  <g class="floating" transform="translate(50, 75)">
    <text x="0" y="0" class="title">Awesome Desktop Notifications</text>
    <text x="0" y="32" class="subtitle">&amp; Team Collaboration Alerts</text>
    <text x="0" y="62" class="desc">Push Daemons &bull; Webhook Event Pipelines &bull; Multi-Channel Routers &bull; In-App Hubs</text>
  </g>

  <!-- Decorative Orbs -->
  <circle cx="700" cy="50" r="22" fill="#6366f1" opacity="0.3" />
  <circle cx="740" cy="120" r="38" fill="#ec4899" opacity="0.2" />
  <circle cx="660" cy="140" r="14" fill="#38bdf8" opacity="0.3" />
</svg>
