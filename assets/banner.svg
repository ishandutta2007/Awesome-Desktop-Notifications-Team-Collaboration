<svg width="1000" height="260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#311042;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="260" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Category Tag -->
  <rect x="360" y="24" width="280" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="378" cy="39" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="395" y="44" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" letter-spacing="1">
    CURATED DEVELOPER ECOSYSTEM
  </text>

  <!-- Main Title -->
  <text x="500" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#ffffff">
    Awesome Desktop Notifications
  </text>

  <!-- Subtitle with Dynamic Gradient -->
  <text x="500" y="148" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="url(#textGrad)">
    &amp; Team Collaboration Alerts
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" />
  </text>

  <!-- Tagline -->
  <text x="500" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">
    Push Daemons &bull; Webhook Event Pipelines &bull; Multi-Channel Routers &bull; In-App Hubs
  </text>

  <!-- Feature Pills -->
  <g transform="translate(130, 205)">
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="82" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">&#9889; Webhook Alerts</text>

    <rect x="180" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="267" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">&#128276; Desktop Daemons</text>

    <rect x="370" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="457" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">&#128236; In-App Feeds</text>

    <rect x="560" y="0" width="180" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="650" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">&#128257; Multi-Channel</text>
  </g>
</svg>
