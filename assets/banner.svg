<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow-cyan" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Pill & Card Gradients -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="bell-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Filters for Glow & Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bell-swing {
        transform-origin: 600px 72px;
        animation: swing 4s ease-in-out infinite;
      }
      .wave-pulse {
        animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 600px 92px;
      }
      .wave-pulse-2 {
        animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) 0.8s infinite;
        transform-origin: 600px 92px;
      }
      .float-card-left {
        animation: floatLeft 6s ease-in-out infinite;
      }
      .float-card-right {
        animation: floatRight 6.5s ease-in-out 1s infinite;
      }
      .flow-dot {
        animation: dashFlow 3s linear infinite;
      }
      .pill-hover {
        transition: transform 0.3s;
      }

      @keyframes swing {
        0%, 100% { transform: rotate(0deg); }
        15% { transform: rotate(14deg); }
        30% { transform: rotate(-12deg); }
        45% { transform: rotate(8deg); }
        60% { transform: rotate(-5deg); }
        75% { transform: rotate(0deg); }
      }
      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0.2; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#glow-cyan)" rx="16" />
  <rect width="100%" height="100%" fill="url(#glow-purple)" rx="16" />
  <rect width="100%" height="100%" fill="url(#glow-amber)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- DYNAMIC BACKGROUND / AMBIENT ELEMENTS (Safely behind and flanking text) -->
  <!-- Left Side: Notification Dispatch Card (Floating) -->
  <g class="float-card-left" opacity="0.88">
    <rect x="50" y="80" width="220" height="96" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.2" filter="url(#shadow)" />
    <!-- Mini App Icon / Dot -->
    <circle cx="76" cy="108" r="14" fill="#0284c7" />
    <path d="M72 108 L75 111 L81 105" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">ntfy &amp; Gotify</text>
    <text x="100" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Instant Push &bull; 0ms lag</text>
    <rect x="68" y="142" width="180" height="20" rx="6" fill="#38bdf8" fill-opacity="0.15" />
    <text x="76" y="156" font-family="monospace" font-size="9" fill="#38bdf8">POST /alerts 200 OK</text>
  </g>

  <!-- Left Side Lower: Linux / Desktop Toast Daemon (Floating) -->
  <g class="float-card-left" opacity="0.82" style="animation-delay: 1.5s;">
    <rect x="70" y="220" width="230" height="90" rx="12" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.2" filter="url(#shadow)" />
    <rect x="88" y="240" width="26" height="26" rx="6" fill="#9333ea" />
    <!-- Desktop Toast symbol -->
    <path d="M96 248 h10 v8 h-10 z M98 260 h6" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="124" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Dunst / SwayNC</text>
    <text x="124" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Native Desktop Toast</text>
    <circle cx="275" cy="245" r="4" fill="#22c55e" />
  </g>

  <!-- Right Side: Multi-channel Routing Pipeline Card -->
  <g class="float-card-right" opacity="0.88">
    <rect x="930" y="80" width="220" height="96" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="956" cy="108" r="14" fill="#4f46e5" />
    <!-- Channel Hub symbol -->
    <path d="M952 108 h8 M956 104 v8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="980" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Novu &amp; Apprise</text>
    <text x="980" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Cross-Channel Dispatch</text>
    <rect x="948" y="142" width="180" height="20" rx="6" fill="#818cf8" fill-opacity="0.15" />
    <text x="956" y="156" font-family="monospace" font-size="9" fill="#a5b4fc">&gt; Slack, Discord, SMS &bull; OK</text>
  </g>

  <!-- Right Side Lower: Team Incident Dispatch Card -->
  <g class="float-card-right" opacity="0.82" style="animation-delay: 2.5s;">
    <rect x="900" y="220" width="230" height="90" rx="12" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity="0.35" stroke-width="1.2" filter="url(#shadow)" />
    <rect x="918" y="240" width="26" height="26" rx="6" fill="#db2777" />
    <path d="M924 253 h14 M931 247 l5 6 -5 6" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="954" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Team Alert Hub</text>
    <text x="954" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Mattermost / Slack Bots</text>
    <circle cx="1105" cy="245" r="4" fill="#38bdf8" />
  </g>

  <!-- Animated Data Stream Connectors (Background Flows) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4,6" class="flow-dot">
    <path d="M 270 128 C 420 128, 450 180, 520 200" />
    <path d="M 930 128 C 800 128, 750 180, 680 200" stroke="#818cf8" />
    <path d="M 300 265 C 430 265, 460 220, 520 215" stroke="#a855f7" />
    <path d="M 900 265 C 780 265, 740 220, 680 215" stroke="#ec4899" />
  </g>

  <!-- Central Ambient Notification Pulse Rings (Behind Bell & Heading) -->
  <circle cx="600" cy="85" r="32" fill="none" stroke="#f59e0b" stroke-width="2" class="wave-pulse" opacity="0.6"/>
  <circle cx="600" cy="85" r="32" fill="none" stroke="#38bdf8" stroke-width="2" class="wave-pulse-2" opacity="0.6"/>

  <!-- Bell Clapper / Hanger Top Support -->
  <circle cx="600" cy="50" r="4" fill="#fcd34d" />
  <rect x="598" y="52" width="4" height="12" rx="2" fill="#f59e0b" />

  <!-- DYNAMIC SWINGING BELL ICON -->
  <g class="bell-swing" filter="url(#glow-filter)">
    <circle cx="600" cy="65" r="5" fill="#fef08a" />
    <!-- Bell Body -->
    <path d="M 584 94 C 584 76, 590 68, 600 68 C 610 68, 616 76, 616 94 C 616 101, 623 103, 624 106 C 625 109, 620 110, 600 110 C 580 110, 575 109, 576 106 C 577 103, 584 101, 584 94 Z" fill="url(#bell-grad)" stroke="#fef08a" stroke-width="1.5" />
    <!-- Bell Clapper Ball -->
    <circle cx="600" cy="113" r="4.5" fill="#fef08a" />
    <!-- Sound Waves Flanking the Bell -->
    <path d="M 567 82 C 561 88, 561 97, 567 103" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M 633 82 C 639 88, 639 97, 633 103" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- ================= FOREGROUND CONTENT LAYER ================= -->
  <!-- Guarantees title, subtitle, badges, and pillars are prominently in front -->

  <!-- Main Title -->
  <g id="foreground-title">
    <!-- Glow Backdrop for Title Readability -->
    <text x="600" y="172" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="37" 
          font-weight="900" 
          letter-spacing="-0.5" 
          text-anchor="middle" 
          fill="#000000" 
          opacity="0.8" 
          stroke="#0a0c16" 
          stroke-width="8" 
          stroke-linejoin="round">
      Awesome Desktop Notifications &amp; Team Collaboration
    </text>
    <text x="600" y="172" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="37" 
          font-weight="900" 
          letter-spacing="-0.5" 
          text-anchor="middle" 
          fill="url(#title-grad)">
      Awesome Desktop Notifications &amp; Team Collaboration
    </text>
  </g>

  <!-- Subtitle -->
  <g id="foreground-subtitle">
    <text x="600" y="212" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16.5" 
          font-weight="500" 
          letter-spacing="0.2" 
          text-anchor="middle" 
          fill="#f1f5f9">
      Curated Directory of Open-Source Projects, Self-Hosted Daemons &amp; SaaS Infrastructure
    </text>
    <text x="600" y="238" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="13.5" 
          font-weight="400" 
          letter-spacing="0.4" 
          text-anchor="middle" 
          fill="#94a3b8">
      Push Relays &bull; Desktop Alert Daemons &bull; Webhook Pipelines &bull; In-App Hubs
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="380" y1="262" x2="820" y2="262" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7"/>
  <circle cx="600" cy="262" r="3" fill="#38bdf8"/>

  <!-- FEATURE PILLS / ARCHITECTURAL DOMAINS (Bottom Shelf) -->
  <g id="foreground-pills" transform="translate(0, 286)">
    <!-- Pill 1: Push Daemons -->
    <g transform="translate(140, 0)">
      <rect width="200" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="19" r="7" fill="#0284c7" />
      <text x="24" y="22" font-size="9" text-anchor="middle" fill="#ffffff">⚡</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Self-Hosted Push</text>
    </g>

    <!-- Pill 2: Desktop Toast Alerts -->
    <g transform="translate(365, 0)">
      <rect width="210" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="19" r="7" fill="#9333ea" />
      <text x="24" y="22" font-size="9" text-anchor="middle" fill="#ffffff">💻</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Desktop Toast Daemons</text>
    </g>

    <!-- Pill 3: Multi-Channel Gateways -->
    <g transform="translate(600, 0)">
      <rect width="210" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="19" r="7" fill="#4f46e5" />
      <text x="24" y="22" font-size="9" text-anchor="middle" fill="#ffffff">🌐</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Multi-Channel Routing</text>
    </g>

    <!-- Pill 4: Team Collaboration -->
    <g transform="translate(835, 0)">
      <rect width="220" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="24" cy="19" r="7" fill="#db2777" />
      <text x="24" y="22" font-size="9" text-anchor="middle" fill="#ffffff">💬</text>
      <text x="42" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Team Chat &amp; Incident Bots</text>
    </g>
  </g>

  <!-- Bottom Badges / Metrics Indicator Bar -->
  <g transform="translate(0, 360)">
    <!-- Subtle status bar at bottom -->
    <rect x="330" y="0" width="540" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="355" cy="14" r="5" fill="#22c55e" />
    <text x="372" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Cross-Platform</text>
    <text x="472" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">&bull;</text>
    <text x="492" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Privacy-Preserving</text>
    <text x="618" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">&bull;</text>
    <text x="638" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">Real-Time Event Pipelines</text>
  </g>
</svg>